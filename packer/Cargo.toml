[package]
name = "philae"
version = "0.1.0"
edition = "2021"
description = "Repackage an Android APK into an iOS IPA that carries its own Android runtime"
license = "MIT"
repository = "https://github.com/Tryanks/philae"
readme = "../README.md"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
plist = "1"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
